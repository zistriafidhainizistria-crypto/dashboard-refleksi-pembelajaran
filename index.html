    function getLocalDateStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDateIndo(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      return d.toLocaleDateString('id-ID', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '-';
      const [y, m, d] = dateStr.split('-');
      const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
      return dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

          this.save(initial);
          return initial;
        }

      save(data) {

      reset() {
        const initial = createInitialDatabase();
        this.save(initial);
        return initial;

          actor_role: actorRole,
          actor_name: actorName,
          action,
          detail
        });
        if (data.activity_logs.length > 200) {
          data.activity_logs = data.activity_logs.slice(0, 200);
        }
        this.save(data);
      },

      getAnonymousReflectionsForTeacher(teacherUser) {
        if (!teacherUser || teacherUser.role !== 'GURU') return [];
        const data = this.load();
        return data.reflections
          .map(r => ({

-- REFLEKSIKU: SUPABASE POSTGRESQL SCHEMA & ROW LEVEL SECURITY (RLS)
-- Keamanan Berlapis: Zero-Leak Student Identity pada Role Guru
-- ============================================================================

-- 1. TABEL KELAS (X, XI, XII)
CREATE TABLE public.classes (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  name TEXT NOT NULL UNIQUE, -- Contoh: 'X IPA 1', 'XI IPS 2'
  grade TEXT NOT NULL CHECK (grade IN ('X', 'XI', 'XII')),
  major TEXT NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

-- 2. TABEL MATA PELAJARAN
CREATE TABLE public.subjects (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  code TEXT NOT NULL UNIQUE,
  name TEXT NOT NULL,
  category TEXT DEFAULT 'Umum',
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

-- 3. TABEL PROFILES (Terhubung ke auth.users)
CREATE TABLE public.profiles (
  id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
  role TEXT NOT NULL CHECK (role IN ('SISWA', 'GURU', 'ADMIN')),
  full_name TEXT NOT NULL,
  nis_or_nip TEXT UNIQUE,
  class_id UUID REFERENCES public.classes(id) ON DELETE SET NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

-- 4. TABEL TEACHERS (Daftar Guru Pengajar)
CREATE TABLE public.teachers (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  profile_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE,
  full_name TEXT NOT NULL,
  specialty TEXT,
  is_active BOOLEAN DEFAULT TRUE
);

-- 5. TABEL REFLECTION QUESTIONS (Dinamis oleh Admin)
CREATE TABLE public.reflection_questions (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  question_order INT NOT NULL,
  question_key TEXT NOT NULL UNIQUE,
  question_text TEXT NOT NULL,
  question_type TEXT NOT NULL,
  is_active BOOLEAN DEFAULT TRUE
);

-- 6. TABEL REFLECTIONS (Data Utama Refleksi)
CREATE TABLE public.reflections (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  student_id UUID NOT NULL REFERENCES public.profiles(id) ON DELETE RESTRICT,
  class_id UUID NOT NULL REFERENCES public.classes(id),
  subject_id UUID NOT NULL REFERENCES public.subjects(id),
  teacher_id UUID NOT NULL REFERENCES public.teachers(id),
  reflection_date DATE NOT NULL DEFAULT CURRENT_DATE,
  feeling TEXT NOT NULL,
  understanding TEXT NOT NULL,
  new_learning TEXT NOT NULL,
  most_interesting TEXT NOT NULL,
  has_confusion TEXT NOT NULL CHECK (has_confusion IN ('Tidak ada', 'Ada')),
  confusion_detail TEXT,
  activeness TEXT NOT NULL,
  teaching_method TEXT NOT NULL,
  self_improvement TEXT NOT NULL,
  suggestion TEXT NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  -- Mencegah duplikasi pengiriman refleksi untuk mapel yang sama di hari yang sama
  CONSTRAINT unique_daily_subject_reflection UNIQUE (student_id, subject_id, reflection_date)
);

-- 7. TABEL ACTIVITY LOGS
CREATE TABLE public.activity_logs (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  actor_id UUID REFERENCES auth.users(id),
  actor_role TEXT NOT NULL,
  action TEXT NOT NULL,
  detail TEXT,
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

-- ============================================================================
-- AKTIFKAN ROW LEVEL SECURITY (RLS)
-- ============================================================================
ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.reflections ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.classes ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.subjects ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.activity_logs ENABLE ROW LEVEL SECURITY;

-- Kebijakan Siswa: Hanya membaca & membuat refleksi miliknya sendiri
CREATE POLICY "Siswa baca refleksi sendiri" ON public.reflections
  FOR SELECT USING (auth.uid() = student_id);

CREATE POLICY "Siswa kirim refleksi sendiri" ON public.reflections
  FOR INSERT WITH CHECK (
    auth.uid() = student_id AND
    EXISTS (SELECT 1 FROM public.profiles WHERE id = auth.uid() AND role = 'SISWA')
  );
-- Tidak ada policy UPDATE/DELETE untuk siswa (Immutable setelah dikirim)

-- Kebijakan Admin: Akses penuh ke semua tabel
CREATE POLICY "Admin akses penuh reflections" ON public.reflections
  FOR ALL USING (
    EXISTS (SELECT 1 FROM public.profiles WHERE id = auth.uid() AND role = 'ADMIN')
  );

-- ============================================================================
-- SECURE VIEW UNTUK GURU (ZERO STUDENT IDENTITY LEAKAGE)
-- Guru TIDAK diberi akses SELECT langsung ke tabel public.reflections,
-- melainkan hanya ke VIEW anonymous_reflections ini!
-- ============================================================================
CREATE OR REPLACE VIEW public.anonymous_reflections
WITH (security_barrier = true) AS
SELECT
  r.id,
  r.reflection_date,
  r.created_at,
  c.name AS class_name,
  s.name AS subject_name,
  t.full_name AS teacher_name,
  r.feeling,
  r.understanding,
  r.new_learning,
  r.most_interesting,
  r.has_confusion,
  r.confusion_detail,
  r.activeness,
  r.teaching_method,
  r.self_improvement,
  r.suggestion
  -- Kolom student_id sengaja TIDAK PERNAH disertakan dalam View ini!
FROM public.reflections r
JOIN public.classes c ON r.class_id = c.id
JOIN public.subjects s ON r.subject_id = s.id
JOIN public.teachers t ON r.teacher_id = t.id;

GRANT SELECT ON public.anonymous_reflections TO authenticated;`;

    function initSession() {
      const savedSession = localStorage.getItem(SESSION_KEY);
      if (savedSession) {
        try {
          const parsed = JSON.parse(savedSession);
          const db = DB.load();
          const freshUser = db.users.find(u => u.id === parsed.id);
          if (freshUser) {
            state.currentUser = freshUser;
            state.activeTab = 'dashboard';
          }
        } catch (e) {
          localStorage.removeItem(SESSION_KEY);
        }
      }
    }

    function loginWithUser(userId) {
      const db = DB.load();
      const user = db.users.find(u => u.id === userId);
      if (!user) {
        showToast('Akun tidak ditemukan.', 'error');
        return;
      }
      state.currentUser = user;
      state.activeTab = 'dashboard';
      state.adminSubTab = 'overview';
      localStorage.setItem(SESSION_KEY, JSON.stringify({ id: user.id }));
      DB.logActivity(user.role, user.full_name, 'LOGIN', `Masuk ke sistem sebagai ${user.role}`);
      showToast(`Selamat datang, ${user.full_name}!`, 'success');
      render();

      const found = db.users.find(u =>

         u.email.toLowerCase() === identifier ||
         (u.nis && u.nis === identifier)) &&
        u.password === password

        return;

      loginWithUser(found.id);

    function submitStudentReflection(e) {
      e.preventDefault();
      if (state.isSubmitting) return;

      const user = state.currentUser;
      const d = state.formDraft;

      // Validasi semua pilihan wajib
      if (!d.subject_id || !d.teacher_id) {
        showToast('Silakan pilih Mata Pelajaran dan Guru Pengajar.', 'warning');
        return;
      }
      if (!d.feeling || !d.understanding || !d.activeness || !d.teaching_method) {
        showToast('Mohon lengkapi semua pilihan perasaan, pemahaman, keaktifan, dan metode mengajar.', 'warning');
        return;
      }
      if (d.has_confusion === 'Ada' && !d.confusion_detail.trim()) {
        showToast('Mohon jelaskan bagian materi yang belum dipahami.', 'warning');
        return;
      }

      const db = DB.load();
      const todayStr = getLocalDateStr(0);

      // Pencegahan pengiriman ganda (Anti-Double Submit pada mapel & hari yang sama)
      const duplicate = db.reflections.find(r =>
        r.student_id === user.id &&
        r.subject_id === d.subject_id &&
        r.date_only === todayStr
      );

      if (duplicate) {
        showToast('Kamu sudah mengirimkan refleksi untuk mata pelajaran ini hari ini. Pengiriman ganda dicegah otomatis.', 'warning');
        return;
      }

      state.isSubmitting = true;
      const subjectObj = db.subjects.find(s => s.id === d.subject_id);
      const teacherObj = db.users.find(u => u.id === d.teacher_id);

      const newEntry = {
        id: 'ref-' + Date.now(),
        student_id: user.id,
        student_name: user.full_name,
        class_id: user.class_id,
        class_name: user.class_name,
        subject_id: d.subject_id,
        subject_name: subjectObj ? subjectObj.name : 'Mata Pelajaran',
        teacher_id: d.teacher_id,
        teacher_name: teacherObj ? teacherObj.full_name : 'Guru',
        date_only: todayStr,
        created_at: new Date().toISOString(),
        feeling: d.feeling,
        understanding: d.understanding,
        new_learning: d.new_learning.trim(),
        most_interesting: d.most_interesting.trim(),
        has_confusion: d.has_confusion,
        confusion_detail: d.has_confusion === 'Ada' ? d.confusion_detail.trim() : '',
        activeness: d.activeness,
        teaching_method: d.teaching_method,
        self_improvement: d.self_improvement.trim(),
        suggestion: d.suggestion.trim()
      };

      db.reflections.unshift(newEntry);
      DB.save(db);
      DB.logActivity('SISWA', user.full_name, 'SUBMIT_REFLECTION', `Mengirim refleksi ${newEntry.subject_name} (${user.class_name})`);

      // Reset draft
      state.formDraft = {
        subject_id: '',
        teacher_id: '',
        feeling: '',
        understanding: '',
        new_learning: '',
        most_interesting: '',
        has_confusion: 'Tidak ada',
        confusion_detail: '',
        activeness: '',
        teaching_method: '',
        self_improvement: '',
        suggestion: ''
      };
      state.isSubmitting = false;
      state.activeTab = 'dashboard';
      render();

      // Tampilkan Modal Terima Kasih sesuai spesifikasi Master Prompt
      openSuccessReflectionModal();
    }

    // ============================================================================
    // 2. TEACHER VIEW (DASHBOARD ANALITIK & TABEL ANONIM ZERO-IDENTITY)
    // ============================================================================
    function getFilteredTeacherReflections() {
      const user = state.currentUser;
      // SECURITY CRITICAL: Mengambil data yang sudah dibersihkan dari identitas siswa
      let list = DB.getAnonymousReflectionsForTeacher(user);
      const today = getLocalDateStr(0);
      const yesterday = getLocalDateStr(-1);

      if (state.teacherDatePreset === 'today') {
        list = list.filter(r => r.date_only === today);
      } else if (state.teacherDatePreset === 'yesterday') {
        list = list.filter(r => r.date_only === yesterday);
      } else if (state.teacherDatePreset === 'specific' && state.teacherSpecificDate) {
        list = list.filter(r => r.date_only === state.teacherSpecificDate);
      } else if (state.teacherDatePreset === 'range') {
        if (state.teacherRangeStart) {
          list = list.filter(r => r.date_only >= state.teacherRangeStart);
        }
        if (state.teacherRangeEnd) {
          list = list.filter(r => r.date_only <= state.teacherRangeEnd);
        }
      }

      if (state.teacherFilterClass) {
        list = list.filter(r => r.class_id === state.teacherFilterClass);
      }
      if (state.teacherFilterSubject) {
        list = list.filter(r => r.subject_id === state.teacherFilterSubject);
      }
      if (state.teacherSearchQuery.trim()) {
        const q = state.teacherSearchQuery.toLowerCase();
        list = list.filter(r =>
          r.new_learning.toLowerCase().includes(q) ||
          r.most_interesting.toLowerCase().includes(q) ||
          r.suggestion.toLowerCase().includes(q) ||
          (r.confusion_detail && r.confusion_detail.toLowerCase().includes(q)) ||
          r.class_name.toLowerCase().includes(q) ||
          r.subject_name.toLowerCase().includes(q)
        );
      }

      return list;
    }

    function exportTeacherExcel() {
      const filtered = getFilteredTeacherReflections();
      if (filtered.length === 0) {
        showToast('Tidak ada data untuk diekspor.', 'warning');
        return;
      }

      // Pastikan data ekspor juga 100% bebas identitas siswa
      const rows = filtered.map((r, i) => ({
        'No': i + 1,
        'Tanggal': r.date_only,
        'Kelas': r.class_name,
        'Mata Pelajaran': r.subject_name,
        'Guru Pengajar': r.teacher_name,
        'Perasaan Siswa': r.feeling,
        'Tingkat Pemahaman': r.understanding,
        'Hal Baru Dipelajari': r.new_learning,
        'Bagian Paling Menarik': r.most_interesting,
        'Ada Materi Belum Dipahami': r.has_confusion,
        'Penjelasan Kendala': r.confusion_detail || '-',
        'Keaktifan Siswa': r.activeness,
        'Pendapat Metode Mengajar': r.teaching_method,
        'Rencana Perbaikan Diri': r.self_improvement,
        'Saran Pembelajaran': r.suggestion
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Refleksi_Anonim');
      XLSX.writeFile(wb, `REFLEKSIKU_Laporan_Anonim_${getLocalDateStr(0)}.xlsx`);
      DB.logActivity('GURU', state.currentUser.full_name, 'EXPORT_EXCEL', `Mengunduh ${rows.length} data refleksi anonim (.xlsx)`);
      showToast('Laporan Excel tanpa identitas siswa berhasil diunduh!', 'success');
    }

    function toggleUserRoleFields() {
      const role = document.getElementById('usr-role').value;
      document.getElementById('usr-class-group').classList.toggle('hidden', role !== 'SISWA');

    function saveUserForm(e, userId) {
      e.preventDefault();
      const db = DB.load();
      const role = document.getElementById('usr-role').value;
      const full_name = document.getElementById('usr-fullname').value.trim();
      const username = document.getElementById('usr-username').value.trim();
      const idNum = document.getElementById('usr-nis').value.trim();
      const password = document.getElementById('usr-password').value.trim();
      const class_id = document.getElementById('usr-class').value;
      const specialty = document.getElementById('usr-specialty').value.trim();
      const classObj = db.classes.find(c => c.id === class_id);

      const colors = ['#F8DCE8', '#DCEFE1', '#FFF1BD', '#E6DDF5', '#F9DFCC'];
      const payload = {
        role,
        full_name,
        username,
        email: `${username}@sman1.sch.id`,
        password,
        nis: role === 'SISWA' ? idNum : undefined,
        nip: role !== 'SISWA' ? idNum : undefined,
        class_id: role === 'SISWA' ? class_id : undefined,
        class_name: role === 'SISWA' && classObj ? classObj.name : undefined,
        specialty: role !== 'SISWA' ? specialty : undefined,
      };

      if (userId) {
        const idx = db.users.findIndex(u => u.id === userId);
        if (idx !== -1) {
          db.users[idx] = { ...db.users[idx], ...payload };
          DB.logActivity('ADMIN', state.currentUser.full_name, 'UPDATE_USER', `Memperbarui akun ${full_name} (${role})`);
        }
      } else {
        db.users.push({
          id: 'usr-' + Date.now(),
          avatar_color: colors[db.users.length % colors.length],
          ...payload
        });
        DB.logActivity('ADMIN', state.currentUser.full_name, 'CREATE_USER', `Menambah akun baru ${full_name} (${role})`);
      }

      DB.save(db);
      closeModal();
      showToast('Data akun berhasil disimpan.', 'success');
      render();
    }

    function deleteUser(userId) {
      const db = DB.load();
      const target = db.users.find(u => u.id === userId);
      if (!target) return;
      db.users = db.users.filter(u => u.id !== userId);
      DB.save(db);
      DB.logActivity('ADMIN', state.currentUser.full_name, 'DELETE_USER', `Menghapus akun ${target.full_name}`);
      showToast(`Akun ${target.full_name} dihapus.`, 'info');
      render();
    }

    function handleImportStudentsExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet);

          if (!rows.length) {
            showToast('File Excel kosong.', 'warning');
            return;
          }

          const db = DB.load();
          let importedCount = 0;

          rows.forEach((row, idx) => {
            const name = String(row.Nama_Lengkap || row.Nama || '').trim();
            const username = String(row.Username || '').trim() || name.toLowerCase().replace(/\s+/g, '.') + idx;
            const nis = String(row.NIS || '').trim();
            const className = String(row.Kelas || 'X IPA 1').trim();
            const password = String(row.Password || '123').trim();

            if (!name) return;
            const matchedClass = db.classes.find(c => c.name.toLowerCase() === className.toLowerCase()) || db.classes[0];

            if (!db.users.some(u => u.username === username)) {
              db.users.push({
                id: 'usr-imp-' + Date.now() + '-' + idx,
                role: 'SISWA',
                full_name: name,
                username,
                email: `${username}@sman1.sch.id`,
                password,
                nis,
                class_id: matchedClass.id,
                class_name: matchedClass.name,
                avatar_color: '#F8DCE8'
              });
              importedCount++;
            }
          });

          DB.save(db);
          DB.logActivity('ADMIN', state.currentUser.full_name, 'IMPORT_EXCEL_STUDENTS', `Mengimpor ${importedCount} akun siswa dari file Excel`);
          showToast(`Berhasil mengimpor ${importedCount} akun siswa baru!`, 'success');
          render();
        } catch (err) {
          showToast('Gagal membaca file Excel. Pastikan format sesuai template.', 'error');

    function mountChartsIfNeeded() {
      if (!state.currentUser) return;

      if (state.currentUser.role === 'GURU' && state.activeTab === 'dashboard') {
        const filtered = getFilteredTeacherReflections();
        const allAnon = DB.getAnonymousReflectionsForTeacher(state.currentUser);

        // 1. Understanding Bar Chart
        const ctxU = document.getElementById('chart-teacher-understanding');
        if (ctxU) {
          const labelsU = ['Sangat paham', 'Paham', 'Cukup paham', 'Kurang paham', 'Belum paham'];
          const countsU = labelsU.map(l => filtered.filter(r => r.understanding === l).length);
          chartInstances.u = new Chart(ctxU, {
            type: 'bar',
            data: {
              labels: ['Sgt Paham', 'Paham', 'Cukup', 'Kurang', 'Belum'],
              datasets: [{
                label: 'Siswa',
                data: countsU,
                backgroundColor: ['#DCEFE1', '#E6DDF5', '#FFF1BD', '#F9DFCC', '#F6DADA'],
                borderColor: ['#10B981', '#8B5CF6', '#F59E0B', '#F97316', '#EF4444'],
                borderWidth: 1.5,
                borderRadius: 10
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } }, grid: { color: '#F1F5F9' } },
                x: { ticks: { font: { size: 10 } }, grid: { display: false } }
              }
            }
          });
        }

        // 2. Feeling Doughnut Chart
        const ctxF = document.getElementById('chart-teacher-feeling');
        if (ctxF) {
          const labelsF = ['Sangat senang', 'Senang', 'Biasa saja', 'Bingung', 'Kurang nyaman'];
          const countsF = labelsF.map(l => filtered.filter(r => r.feeling === l).length);
          chartInstances.f = new Chart(ctxF, {
            type: 'doughnut',
            data: {
              labels: labelsF,
              datasets: [{
                data: countsF,
                backgroundColor: ['#DCEFE1', '#FFF1BD', '#E6DDF5', '#F9DFCC', '#F6DADA'],
                borderColor: '#FFFFFF',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '62%',
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
              }
            }
          });
        }

        // 3. Daily Trend Line Chart (Last 7 Days)
        const ctxD = document.getElementById('chart-teacher-daily');
        if (ctxD) {
          const days = [];
          const dayCounts = [];
          for (let i = -6; i <= 0; i++) {
            const dStr = getLocalDateStr(i);
            days.push(dStr.slice(5)); // MM-DD
            dayCounts.push(allAnon.filter(r => r.date_only === dStr).length);
          }
          chartInstances.d = new Chart(ctxD, {
            type: 'line',
            data: {
              labels: days,
              datasets: [{
                label: 'Refleksi',
                data: dayCounts,
                borderColor: '#6366F1',
                backgroundColor: 'rgba(230, 221, 245, 0.55)',
                fill: true,
                tension: 0.35,
                pointRadius: 4,
                pointBackgroundColor: '#1E293B'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } }, grid: { color: '#F1F5F9' } },
                x: { ticks: { font: { size: 10 } }, grid: { display: false } }
              }
            }
          });
        }
      }

      if (state.currentUser.role === 'ADMIN' && state.activeTab === 'dashboard' && state.adminSubTab === 'overview') {
        const db = DB.load();
        const ctxAct = document.getElementById('chart-admin-activity');
        if (ctxAct) {
          const days = [];
          const counts = [];
          for (let i = -6; i <= 0; i++) {
            const dStr = getLocalDateStr(i);
            days.push(formatShortDate(dStr));
            counts.push(db.reflections.filter(r => r.date_only === dStr).length);
          }
          chartInstances.adminAct = new Chart(ctxAct, {
            type: 'bar',
            data: {
              labels: days,
              datasets: [{
                label: 'Jumlah Refleksi',
                data: counts,
                backgroundColor: '#E6DDF5',
                borderColor: '#7C3AED',
                borderWidth: 1.5,
                borderRadius: 12
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } },
                x: { grid: { display: false } }
              }
            }
          });
        }

        const ctxCls = document.getElementById('chart-admin-classes');
        if (ctxCls) {
          const clsLabels = db.classes.map(c => c.name);
          const clsCounts = db.classes.map(c => db.reflections.filter(r => r.class_id === c.id).length);
          chartInstances.adminCls = new Chart(ctxCls, {
            type: 'doughnut',
            data: {
              labels: clsLabels,
              datasets: [{
                data: clsCounts,
                backgroundColor: ['#FFF1BD', '#F8DCE8', '#F9DFCC', '#E6DDF5', '#DCEFE1', '#F6DADA'],
                borderColor: '#FFFFFF',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '60%',
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
              }
            }
          });
        }
      }
    }

    // ============================================================================
    // BOOTSTRAP APPLICATION
    // ============================================================================
    window.addEventListener('DOMContentLoaded', () => {
      DB.load(); // Ensure seed data exists
      initSession();
      render();
    });
  </script>
</body>
</html>
